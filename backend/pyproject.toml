[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "DocuMind AI backend: API documentation ingestion, RAG and MCP server."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.9,<3.0",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",  # schema migrations (docs/ARCHITECTURE.md section 2.1)
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3,<1.0",
    "openai>=1.54,<2.0",
    "mcp>=1.2,<2.0",
    "pypdf>=5.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12",  # required by FastAPI for UploadFile
    "aiofiles>=24.1",  # non-blocking file I/O (docs/RULES.md section 3)
    "tiktoken>=0.8,<1.0",  # token counting for chunk budgets (docs/RULES.md section 4)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-PyYAML>=6.0",
    "types-aiofiles>=24.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern 3.12 syntax)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async (blocking calls in async code)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in tests

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
