# Alembic configuration. The database URL is NOT set here: alembic/env.py reads it from the
# application settings (DATABASE_URL), so no credentials are ever stored in this file.
[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# Upper-bound the generated file name slug.
truncate_slug_length = 40
